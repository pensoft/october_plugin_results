# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Result

# Model Form Field configuration
form: $/pensoft/results/models/result/fields.yaml

# Model Class name
modelClass: Pensoft\Results\Models\Result

# Default redirect location
defaultRedirect: pensoft/results/results

# Create page
create:
    title: backend::lang.form.create_title
    redirect: pensoft/results/results/update/:id
    redirectClose: pensoft/results/results

# Update page
update:
    title: backend::lang.form.update_title
    redirect: pensoft/results/results
    redirectClose: pensoft/results/results

# Preview page
preview:
    title: backend::lang.form.preview_title
