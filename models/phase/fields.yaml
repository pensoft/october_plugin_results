# ===================================
#  Form Field Definitions
# ===================================

fields:
    name:
        label: Name
        comment: 'Use a line break in the label by keeping the wording short, e.g. "Data Foundation".'
        span: left
        required: 1
        type: text
    position_x:
        label: 'Horizontal position (%)'
        comment: 'Distance from the left edge of the timeline, 0-100.'
        span: right
        type: number
        step: 0.1
        default: 50
